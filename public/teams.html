<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams | HR System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="nav-toggle">
    
    <div class="sidebar">
        <div class="sidebar-brand">
            <h2><span class="fas fa-cube"></span> <span>HR System</span></h2>
        </div>
        <div class="sidebar-menu">
            <ul id="sidebar-menu-list">
                </ul>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h2>
                <label for="nav-toggle" class="mobile-toggle">
                    <span class="fas fa-bars"></span>
                </label>
                Teams Management
            </h2>

            <div class="search-wrapper">
                <span class="fas fa-search"></span>
                <input type="search" id="team-search-input" placeholder="Search teams...">
            </div>

            <div class="user-wrapper">
                <img id="nav-user-pic" src="https://ui-avatars.com/api/?name=User&background=ddd&color=fff" width="40px" height="40px" alt="">
                
                <div>
                    <h4 id="nav-user-name">Loading...</h4>
                    <small id="nav-user-role">Manager</small>
                </div>
            </div>
        </header>

        <main>
            <div class="dept-grid" id="team-grid">
                <div class="loading-card">Loading Teams...</div>
            </div>
        </main>
    </div>

    <div id="teamModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="teamModalTitle">Add New Team</h3>
                <span class="close-modal" onclick="closeTeamModal()">&times;</span>
            </div>
            
            <form id="teamForm" onsubmit="handleTeamSubmit(event)">
                <input type="hidden" id="teamId">

                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="teamName" required placeholder="e.g. Frontend Developers">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select id="teamDeptSelect" required>
                        <option value="">-- Select Department --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Team Lead</label>
                    <input type="text" id="teamLead" placeholder="e.g. Rayane Benjelloun">
                </div>
                <div class="form-group">
                    <label>Select Marketing Members</label>
                    <div id="team-member-selector" style="border: 1px solid #ddd; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto;">
                        <p style="color: #888; font-size: 0.9rem;">Please select a department first...</p>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeTeamModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Team</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData(); 
            loadTeams(); // This will render the cards
            fillDeptDropdown(); // This fills the <select> inside the modal
        });
    </script>
</body>
</html>
