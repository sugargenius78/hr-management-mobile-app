<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees | HR System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="checkbox" id="nav-toggle">
    
    <div class="sidebar">
        <div class="sidebar-brand">
            <h2><span class="fas fa-cube"></span> <span>HR System</span></h2>
        </div>
        <div class="sidebar-menu">
            <ul id="sidebar-menu-list">
                </ul>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h2>
                <label for="nav-toggle" class="mobile-toggle">
                    <span class="fas fa-bars"></span>
                </label>
                Employees Management
            </h2>
            <div class="user-wrapper">
                <img id="nav-user-pic" src="https://ui-avatars.com/api/?name=User&background=ddd&color=fff" width="40px" height="40px" alt="">
                
                <div>
                    <h4 id="nav-user-name">Loading...</h4>
                    <small id="nav-user-role">Manager</small>
                </div>
            </div>
        </header>

        <main>
            <div class="action-bar">
                <div class="search-box">
                    <span class="fas fa-search"></span>
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search by name, role...">
                </div>
                
                <div id="bulk-actions" style="display:none; gap: 10px;">
                    <button id="btn-bulk-edit" class="btn-add btn-edit-bulk" onclick="editSelected()" style="opacity: 0.5; pointer-events: none;">
                        <span class="fas fa-edit"></span> Edit
                    </button>
                    
                    <button id="btn-bulk-delete" class="btn-add btn-danger" onclick="deleteSelected()" style="opacity: 0.5; pointer-events: none;">
                        <span class="fas fa-trash"></span> Delete (0)
                    </button>
                </div>

                <button class="btn-add" onclick="openModal()">
                    <span class="fas fa-plus"></span> Add Employee
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>All Staff Members</h3>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table width="100%" id="employeeTable">
                            <thead>
                                <tr>
                                    <td style="width: 40px;"><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></td>
                                    <td>Employee</td>
                                    <td>Role</td>
                                    <td>Department</td>
                                    <td>Team</td>
                                    <td>Actions</td>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr>
                                    <td colspan="5" style="text-align:center;">Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="addEmployeeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Employee</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            
            <form id="addEmployeeForm" onsubmit="submitNewEmployee(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="empName" required placeholder="e.g. John Doe">
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="empEmail" required placeholder="john@company.com">
                </div>

                <div class="form-group">
                    <label>Assign to Team</label>
                    <select id="empTeam">
                        <option value="">-- No Team (General) --</option>
                        </select>
                </div>

                <div class="row">
                    <div class="form-group half">
                        <label>Role</label>
                        <select id="empRole">
                            <option value="Employee">Employee</option>
                            <option value="Admin">HR Manager (Admin)</option>
                        </select>
                    </div>

                    <div class="form-group half">
                        <label>Department</label>
                            <select id="empDept">
                                <option value="IT Department">IT Department</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Management">Management</option>
                            </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // When the page finishes loading, Run this function immediately
        document.addEventListener('DOMContentLoaded', () => {
            fetchEmployees();
            loadUserData(); 
        });
    </script>
</body>
</html>
