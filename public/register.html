<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HR Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="main-container">
        
        <div class="left-side">
            <div class="color-overlay"></div>
        </div>

        <div class="right-side">
            <div class="login-box">
                <h1>Create Account</h1>
                <p class="subtitle">Join the HR Management System</p>

                <div class="input-container">
                    <i class="fas fa-id-card icon"></i>
                    <input type="text" id="reg-name" placeholder="Full Name">
                </div>

                <div class="input-container">
                    <i class="fas fa-envelope icon"></i>
                    <input type="email" id="reg-email" placeholder="Email Address">
                </div>

                <div class="input-container">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="reg-password" placeholder="Create Password">
                </div>

                <div class="input-container">
                    <i class="fas fa-user-tag icon"></i>
                    <select id="reg-role" class="styled-select">
                        <option value="Employee">Employee</option>
                        <option value="Admin">HR Manager</option>
                    </select>
                </div>

                <button onclick="handleRegister()" class="login-btn">Sign Up</button>

                <p class="signup-link">Already have an account? <a href="index.html">Log In</a></p>
                
                <p id="msg" style="color: red; margin-top: 10px;"></p>
            </div>
        </div>
    </div>
    <div id="custom-popup" class="popup-overlay">
        <div class="popup-content">
            <div class="popup-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 id="popup-title">Success!</h2>
            <p id="popup-message">Operation successful.</p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
