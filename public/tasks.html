<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks & Projects | HR System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <input type="checkbox" id="nav-toggle">
    
    <div class="sidebar">
        <div class="sidebar-brand">
            <h2><span class="fas fa-cube"></span> <span>HR System</span></h2>
        </div>
        <div class="sidebar-menu">
            <ul id="sidebar-menu-list">
                </ul>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h2>
                <label for="nav-toggle" class="mobile-toggle">
                    <span class="fas fa-bars"></span>
                </label>
                Tasks & Projects
            </h2>

            <div class="search-wrapper">
                <span class="fas fa-search"></span>
                <input type="search" id="project-search-input" placeholder="Search Projects">
            </div>

            <div class="user-wrapper">
                <img id="nav-user-pic" src="https://ui-avatars.com/api/?name=User&background=ddd&color=fff" width="40px" height="40px" alt="">
                
                <div>
                    <h4 id="nav-user-name">Loading...</h4>
                    <small id="nav-user-role">Manager</small>
                </div>
            </div>
        </header>

        <main>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3>Active Projects</h3>
                <button class="btn-add" onclick="openProjectModal()">+ New Project</button>
            </div>

            <div class="project-list" id="project-list">
                <div class="loading-card">Loading Projects...</div>
            </div>

            <div class="kanban-header">
                <h3 id="current-project-title">Select a project above to view tasks</h3>
                <button class="btn-add btn-sm" id="btn-add-task" style="display:none;" onclick="openTaskModal()">+ Add Task</button>
            </div>

            <div class="kanban-board" id="kanban-board" style="opacity: 0.5; pointer-events: none;">
                <div class="kanban-col">
                    <div class="col-header header-todo">To Do</div>
                    <div class="task-list" id="col-todo"></div>
                </div>
                <div class="kanban-col">
                    <div class="col-header header-progress">In Progress</div>
                    <div class="task-list" id="col-progress"></div>
                </div>
                <div class="kanban-col">
                    <div class="col-header header-done">Done</div>
                    <div class="task-list" id="col-done"></div>
                </div>
            </div>

        </main>
    </div>

    <div id="projectModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Start New Project</h3>
                <span class="close-modal" onclick="closeProjectModal()">&times;</span>
            </div>
            <form onsubmit="handleProjectSubmit(event)">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="projTitle" required placeholder="e.g. Website Redesign">
                </div>
                <div class="form-group half">
                    <label>Department</label>
                    <select id="projDept">
                        <option value="IT Department">IT Department</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Management">Management</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label>Deadline</label>
                    <input type="date" id="projDeadline" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeProjectModal()">Cancel</button>
                    <button type="submit" class="btn-save">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <div id="taskModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Task</h3>
                <span class="close-modal" onclick="closeTaskModal()">&times;</span>
            </div>
            <form onsubmit="handleTaskSubmit(event)">
                <input type="hidden" id="taskProjectId"> 
                <input type="hidden" id="taskId"> 
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="taskTitle" required placeholder="e.g. Design Homepage">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Assign To</label>
                    <input type="text" id="taskAssignee" class="form-control" placeholder="Type name here...">
                </div>
                <div class="form-group half">
                    <label>Priority</label>
                    <select id="taskPriority">
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
                    <button type="submit" class="btn-save">Add Task</button>
                </div>
            </form>
        </div>
    </div>
    <div id="editTaskModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Edit Task Details</h3>
                <span class="close-modal" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editTaskForm" onsubmit="submitEditTask(event)">
                <input type="hidden" id="editTaskId">
                
                <div class="form-group" style="margin-top: 15px;">
                    <label>Task Title</label>
                    <input type="text" id="editTaskTitle" required>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Assign To</label>
                    <input type="text" id="editTaskAssignee" placeholder="Type name here...">
                </div>

                <div class="modal-footer" style="margin-top: 20px;">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            loadProjects(); // We will write this function next
        });
    </script>
</body>
</html>
